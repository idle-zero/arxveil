# Local seven-agent integration fleet.
#
# Run it together with the base stack:
#   docker compose -f infra/compose.yaml -f infra/compose.agents.yaml up --build
#
# The dev token issuer and Rust agent image are implemented in the following
# steps. This file establishes their final local-development wiring.

services:
  dev-token-issuer:
    build:
      context: ..
      dockerfile: server/Dockerfile
    entrypoint: ["/usr/local/bin/arxveil-dev-token-issuer"]
    environment:
      ARXVEIL_TOKEN_ISSUER_SERVER_URL: http://server:8080
      ARXVEIL_TOKEN_ISSUER_DIRECTORY: /bootstrap
      ARXVEIL_TOKEN_ISSUER_AGENT_COUNT: "7"
    volumes:
      - agent_bootstrap_tokens:/bootstrap
    depends_on:
      server:
        condition: service_healthy

  agent-01:
    extends:
      file: compose.agent.template.yaml
      service: agent
    hostname: agent-01
    environment:
      ARXVEIL_AGENT_SERVER_ENDPOINT: http://server:9090
      ARXVEIL_AGENT_ENROLLMENT_TOKEN_FILE: /bootstrap/agent-01.token
      ARXVEIL_AGENT_STATE_DIRECTORY: /var/lib/arxveil
    volumes:
      - agent_bootstrap_tokens:/bootstrap:ro
      - agent_01_state:/var/lib/arxveil

  agent-02:
    extends:
      file: compose.agent.template.yaml
      service: agent
    hostname: agent-02
    environment:
      ARXVEIL_AGENT_SERVER_ENDPOINT: http://server:9090
      ARXVEIL_AGENT_ENROLLMENT_TOKEN_FILE: /bootstrap/agent-02.token
      ARXVEIL_AGENT_STATE_DIRECTORY: /var/lib/arxveil
    volumes:
      - agent_bootstrap_tokens:/bootstrap:ro
      - agent_02_state:/var/lib/arxveil

  agent-03:
