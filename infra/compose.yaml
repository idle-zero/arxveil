name: arxveil

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ARXVEIL_POSTGRES_DB:-arxveil}
      POSTGRES_USER: ${ARXVEIL_POSTGRES_USER:-arxveil}
      POSTGRES_PASSWORD: ${ARXVEIL_POSTGRES_PASSWORD:-arxveil-local-dev}
    ports:
      - "${ARXVEIL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - arxveil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../server/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${ARXVEIL_POSTGRES_USER:-arxveil}:${ARXVEIL_POSTGRES_PASSWORD:-arxveil-local-dev}@postgres:5432/${ARXVEIL_POSTGRES_DB:-arxveil}?sslmode=disable
      - up

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      ARXVEIL_SERVER_ADDRESS: :8080
      ARXVEIL_DATABASE_URL: postgres://${ARXVEIL_POSTGRES_USER:-arxveil}:${ARXVEIL_POSTGRES_PASSWORD:-arxveil-local-dev}@postgres:5432/${ARXVEIL_POSTGRES_DB:-arxveil}?sslmode=disable
    ports:
      - "${ARXVEIL_SERVER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  arxveil_postgres_data:
